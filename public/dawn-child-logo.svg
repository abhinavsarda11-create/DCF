<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" fill="none">
  <defs>
    <!-- Radiant Sun Gradient -->
    <linearGradient id="dc-sun-grad" x1="16" y1="20" x2="80" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="35%" stop-color="#f25c27" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Ray 1 Gradient -->
    <linearGradient id="dc-ray-grad" x1="45" y1="5" x2="160" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="dc-text-grad" x1="100" y1="20" x2="280" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="45%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Drop Shadow for Sun -->
    <filter id="dc-sun-glow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ================= EMBLEM ================= -->
  <g id="emblem" filter="url(#dc-sun-glow)">
    <!-- Flame Ray Tendril 1 (Upper-most long waving ray) -->
    <path
      d="M 58 24 C 68 14, 88 6, 114 14 C 132 19, 146 16, 162 10 C 148 18, 134 24, 112 22 C 92 20, 78 28, 64 34 Z"
      fill="url(#dc-ray-grad)"
    />

    <!-- Flame Ray Tendril 2 (Middle sweeping ray) -->
    <path
      d="M 68 34 C 84 26, 112 28, 136 38 C 152 45, 168 46, 184 42 C 168 50, 150 52, 130 46 C 108 40, 88 44, 74 48 Z"
      fill="url(#dc-ray-grad)"
    />

    <!-- Flame Ray Tendril 3 (Lower wavy ray reaching towards text) -->
    <path
      d="M 74 48 C 90 44, 110 50, 126 58 C 138 64, 148 66, 160 64 C 148 70, 134 70, 120 64 C 104 58, 88 58, 76 60 Z"
      fill="url(#dc-ray-grad)"
    />

    <!-- Vertical Flame Accents (top of sun) -->
    <path
      d="M 44 20 C 42 12, 46 6, 50 2 C 51 8, 49 14, 48 20 Z"
      fill="#ea580c"
    />
    <path
      d="M 32 26 C 29 18, 32 12, 36 7 C 37 13, 35 19, 36 25 Z"
      fill="#ea580c"
    />
    <path
      d="M 54 20 C 56 12, 62 6, 68 3 C 67 9, 62 15, 58 21 Z"
      fill="#f59e0b"
    />

    <!-- Main Radiant Sun Circle -->
    <circle cx="48" cy="54" r="35" fill="url(#dc-sun-grad)" />

    <!-- Soft Golden Sun Inner Glow / Crescent Accent -->
    <path
      d="M 20 44 C 23 28, 38 20, 56 21 C 40 22, 26 32, 23 48 C 21 58, 26 70, 36 78 C 26 71, 18 60, 20 44 Z"
      fill="#ffffff"
      opacity="0.25"
    />

    <!-- Sleeping Baby Silhouette in delicate warm white outlines -->
    <!-- Head Outline -->
    <ellipse cx="44" cy="46" rx="13" ry="14" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />

    <!-- Cute Curl of Hair on Forehead -->
    <path
      d="M 43 32 C 45 27, 51 28, 49 34 C 47 38, 43 36, 44 33"
      fill="none"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Peaceful Closed Eye & Eyelash -->
    <path
      d="M 36 45 C 38 48, 42 48, 44 45"
      fill="none"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linecap="round"
    />
    <path
      d="M 43 45 L 45 43.5"
      stroke="#ffffff"
      stroke-width="1.8"
      stroke-linecap="round"
    />

    <!-- Button Nose -->
    <path
      d="M 33 48 C 34 50, 36 50.5, 38 50"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.8"
      stroke-linecap="round"
    />

    <!-- Sleeping Smile -->
    <path
      d="M 36 53 C 38 55, 41 55, 43 53"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.8"
      stroke-linecap="round"
    />

    <!-- Sweet Curled Baby Hand tucked near chin -->
    <path
      d="M 37 57 C 34 58, 35 63, 38 64 C 41 65, 43 62, 42 58"
      fill="none"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linecap="round"
    />

    <!-- Swaddled/Curled Baby Body curving along bottom of sun -->
    <path
      d="M 52 46 C 58 52, 59 66, 49 74 C 41 80, 31 77, 28 68 C 26 62, 29 57, 32 55"
      fill="none"
      stroke="#ffffff"
      stroke-width="2.2"
      stroke-linecap="round"
    />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- "Dawn Child" Script -->
  <text
    x="112"
    y="56"
    font-family="'Alex Brush', 'Great Vibes', 'Brush Script MT', 'Dancing Script', cursive"
    font-size="44"
    font-weight="normal"
    fill="url(#dc-text-grad)"
    letter-spacing="0.5"
  >
    Dawn Child
  </text>

  <!-- "Early Childhood Care & Education" Subtitle -->
  <text
    x="116"
    y="74"
    font-family="'Plus Jakarta Sans', 'Outfit', system-ui, -apple-system, sans-serif"
    font-size="9.5"
    font-weight="600"
    letter-spacing="1.2"
    fill="#b45309"
  >
    Early Childhood Care &amp; Education
  </text>
</svg>
